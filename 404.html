<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không tìm thấy trang | Bản đồ Lễ rước Điện Huệ Nam</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0D1117;
      color: #E6EDF3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .error-page {
      text-align: center;
      max-width: 480px;
    }
    .error-page__icon {
      font-size: 72px;
      margin-bottom: 1.5rem;
    }
    .error-page__code {
      font-size: 5rem;
      font-weight: 700;
      color: #F0A500;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-page__title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .error-page__text {
      font-size: 1rem;
      color: #8B949E;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .error-page__link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #F0A500;
      color: #0D1117;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .error-page__link:hover {
      background: #FFB627;
      transform: translateY(-2px);
    }
    .error-page__link:active {
      transform: translateY(0);
    }
    .error-page__map-hint {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #6E7681;
    }
  </style>
</head>
<body>
  <div class="error-page" role="main">
    <div class="error-page__icon" aria-hidden="true">🗺️</div>
    <div class="error-page__code">404</div>
    <h1 class="error-page__title">Trang không tồn tại</h1>
    <p class="error-page__text">
      Có vẻ như bạn đã lạc đường trên hành trình. 
      Trang bạn tìm kiếm không tồn tại hoặc đã được di chuyển.
    </p>
    <a href="index.html" class="error-page__link">
      🏛️ Quay về bản đồ
    </a>
    <p class="error-page__map-hint">
      Hãy trở lại và tiếp tục khám phá hành trình Lễ rước Điện Huệ Nam
    </p>
  </div>
</body>
</html>
